models:
  - name: stg_openf1__sessions
    description: One row per race in the calendar, including cancelled and future races.
    columns:
      - name: session_key
        data_tests:
          - unique
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: circuit_name
        description: Short name of the circuit (e.g. Monza, Silverstone).
        data_tests:
          - not_null
      - name: is_cancelled
        description: True if the race was cancelled. Never null.
        data_tests:
          - not_null

  - name: stg_openf1__drivers
    description: One row per race and driver, with team and team colour.
    columns:
      - name: race_driver_id
        description: Surrogate key built from session_key and driver_number.
        data_tests:
          - unique
          - not_null
      - name: driver_code
        description: Three-letter code of the driver (e.g. VER, LEC). Stable across seasons.
        data_tests:
          - not_null
      - name: team_name
        data_tests:
          - not_null
      - name: team_colour
        description: Team colour as a hex string with leading # (e.g. #ED1131).

  - name: stg_openf1__stints
    description: One row per driver and stint, with clean types and missing compounds as null.
    columns:
      - name: stint_id
        description: Surrogate key built from session_key, driver_number and stint_number.
        data_tests:
          - unique
          - not_null
      - name: session_key
        data_tests:
          - not_null
      - name: driver_number
        data_tests:
          - not_null
      - name: compound
        description: Tyre compound, null when not recorded.
        data_tests:
          - accepted_values:
              arguments:
                values: ["SOFT", "MEDIUM", "HARD", "INTERMEDIATE", "WET"]

  - name: stg_openf1__laps
    description: One row per driver and lap, with times in seconds and speeds in km/h.
    columns:
      - name: lap_id
        description: Surrogate key built from session_key, driver_number and lap_number.
        data_tests:
          - unique
          - not_null
      - name: session_key
        data_tests:
          - not_null
      - name: lap_time_s
        description: Lap time in seconds. Null for laps that were not completed (e.g. retirements).
      - name: is_pit_out_lap
        description: True for the lap leaving the pit lane.

  - name: stg_openf1__pit_stops
    description: One row per pit lane passage, with or without a tyre change.
    columns:
      - name: pit_stop_id
        description: Surrogate key built from session_key, driver_number and lap_number.
        data_tests:
          - unique
          - not_null
      - name: lap_number
        description: Lap on which the driver entered the pit lane (in-lap).
        data_tests:
          - not_null
      - name: pit_lane_time_s
        description: Total time spent in the pit lane, in seconds.
      - name: stop_time_s
        description: Stationary time in seconds. Available only from the 2024 US Grand Prix onwards.

  - name: stg_openf1__race_control
    description: >
      Race control messages: session status, flags, safety car, investigations
      and penalties. No natural key: several messages can share the same time.
    columns:
      - name: session_key
        data_tests:
          - not_null
      - name: message_at
        data_tests:
          - not_null
      - name: driver_number
        description: >
          Driver the message refers to. Often null for penalties, where the car
          number is only in the message text.
      - name: category
        description: Type of message (Flag, SafetyCar, Other, ...).
      - name: message
        data_tests:
          - not_null

  - name: stg_openf1__weather
    description: Weather at the track, about one reading per minute during each race.
    columns:
      - name: weather_reading_id
        description: Surrogate key built from session_key and the reading timestamp.
        data_tests:
          - unique
          - not_null
      - name: track_temp_c
        description: Track surface temperature in degrees Celsius.
      - name: is_raining
        description: True if rainfall was detected at the time of the reading.

  - name: stg_openf1__session_results
    description: Final classification of each race, one row per driver.
    columns:
      - name: race_driver_id
        description: Surrogate key built from session_key and driver_number.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_openf1__drivers')
                field: race_driver_id
      - name: race_time_s
        description: Total race time in seconds.
      - name: gap_to_winner_s
        description: Gap to the winner in seconds. Null for lapped drivers and retirements.
      - name: laps_behind
        description: Laps behind the winner for lapped drivers. Null otherwise.