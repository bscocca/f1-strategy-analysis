models:
  - name: stg_openf1__stints
    description: One row per driver and stint, with clean types and missing compounds as null.
    columns:
      - name: stint_id
        description: Surrogate key built from session_key, driver_number and stint_number.
        data_tests:
          - unique
          - not_null
      - name: session_key
        data_tests:
          - not_null
      - name: driver_number
        data_tests:
          - not_null
      - name: compound
        description: Tyre compound, null when not recorded.
        data_tests:
          - accepted_values:
              arguments:
                values: ["SOFT", "MEDIUM", "HARD", "INTERMEDIATE", "WET"]

  - name: stg_openf1__laps
    description: One row per driver and lap, with times in seconds and speeds in km/h.
    columns:
      - name: lap_id
        description: Surrogate key built from session_key, driver_number and lap_number.
        data_tests:
          - unique
          - not_null
      - name: session_key
        data_tests:
          - not_null
      - name: lap_time_s
        description: Lap time in seconds. Null for laps that were not completed (e.g. retirements).
      - name: is_pit_out_lap
        description: True for the lap leaving the pit lane.