models:
  - name: stg_openf1__stints
    description: One row per driver and stint, with clean types and missing compounds as null.
    columns:
      - name: stint_id
        description: Surrogate key built from session_key, driver_number and stint_number.
        data_tests:
          - unique
          - not_null
      - name: session_key
        data_tests:
          - not_null
      - name: driver_number
        data_tests:
          - not_null
      - name: compound
        description: Tyre compound, null when not recorded.
        data_tests:
          - accepted_values:
              arguments:
                values: ["SOFT", "MEDIUM", "HARD", "INTERMEDIATE", "WET"]