models:
  - name: fct_laps
    description: >
      One row per driver and lap across all races, with race, driver, team and
      tyre context, and flags to exclude laps that do not reflect race pace.
      This is the table used by the analysis notebooks, the Streamlit app and
      the Tableau dashboard.
    columns:
      # Race
      - name: lap_id
        description: Surrogate key of the lap, built from session key, driver number and lap number.
        data_tests:
          - unique
          - not_null
      - name: session_key
        description: OpenF1 identifier of the race session.
        data_tests:
          - not_null
      - name: season
        description: Championship year.
        data_tests:
          - not_null
      - name: circuit_name
        description: Short name of the circuit, as given by OpenF1 (e.g. Monza, Sakhir).
        data_tests:
          - not_null
      - name: race_started_at
        description: Scheduled start of the race, in UTC.

      # Driver and team
      - name: driver_number
        description: Car number of the driver.
        data_tests:
          - not_null
      - name: driver_code
        description: Three-letter driver abbreviation (e.g. VER, NOR).
        data_tests:
          - not_null
      - name: driver_name
        description: Full name of the driver.
      - name: team_name
        description: Name of the team in that race.
      - name: team_colour
        description: Team colour as a hex code (e.g. #3671C6), used to colour charts.

      # Lap
      - name: lap_number
        description: Lap number within the race, starting from 1.
        data_tests:
          - not_null
      - name: lap_started_at
        description: >
          Time the driver crossed the line to start the lap, in UTC. Approximate
          according to OpenF1, but precise to about 0.05 s (median); used to
          rebuild the running order and the gaps between cars.
      - name: lap_time_s
        description: Lap time in seconds. Null when the lap was not completed or not timed.
      - name: sector_1_s
        description: Time of the first sector, in seconds.
      - name: sector_2_s
        description: Time of the second sector, in seconds.
      - name: sector_3_s
        description: Time of the third sector, in seconds.
      - name: speed_trap_kmh
        description: Speed at the speed trap, in km/h.

      # Tyres
      - name: stint_number
        description: >
          Number of the stint the lap belongs to, from OpenF1. Where the source
          has overlapping stints (e.g. the wet 2025 Australian GP), the most
          recent stint is kept.
      - name: compound
        description: Tyre compound used on the lap. Null if not recorded or if the lap has no stint.
        data_tests:
          - accepted_values:
              arguments:
                values: ["SOFT", "MEDIUM", "HARD", "INTERMEDIATE", "WET"]
      - name: tyre_age_laps
        description: >
          Laps already completed on the tyre set at the start of this lap,
          including laps run in earlier sessions on a used set.

      # Flags
      - name: is_first_lap
        description: True for lap 1, which includes the standing start.
        data_tests:
          - not_null
      - name: is_pit_out_lap
        description: True for the lap leaving the pit lane.
        data_tests:
          - not_null
      - name: is_pit_in_lap
        description: >
          True for the lap entering the pit lane, with or without a tyre change.
          A lap is a pit entry lap if the OpenF1 pit table records a stop on it,
          or if the next lap of the same driver is a pit exit lap: the pit table
          alone has gaps (no data for the first six races of 2023). Laps before
          a restart from the pit lane after a red flag are also flagged.
          See tests/assert_pit_exit_laps_follow_pit_entry_laps.sql.
        data_tests:
          - not_null
      - name: neutralisation
        description: >
          SC, VSC or RED if the lap was run under safety car, virtual safety car
          or red flag conditions; null under green flag. Based on the leader's
          lap, so it can be off by one lap for lapped drivers.
        data_tests:
          - accepted_values:
              arguments:
                values: ["SC", "VSC", "RED"]
      - name: is_neutralised
        description: True if neutralisation is not null.
        data_tests:
          - not_null
      - name: is_representative_lap
        description: >
          True for laps that reflect race pace: completed, under green flag,
          not lap 1, and neither a pit entry nor a pit exit lap. Use it as the
          default filter for pace and tyre degradation analysis.
        data_tests:
          - not_null